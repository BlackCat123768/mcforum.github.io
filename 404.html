<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - MCWORLD FORUM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #c2b994;
            font-family: 'Segoe UI', 'Verdana', Tahoma, 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            color: #2b2a1e;
            padding: 25px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            max-width: 600px;
            width: 100%;
            background: #fefcf5;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
            border: 1px solid #b6a77c;
            overflow: hidden;
            text-align: center;
            padding: 40px 30px 50px;
        }
        .error-header {
            margin-bottom: 30px;
        }
        .error-header h1 {
            font-size: 72px;
            color: #8b7a50;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .error-header p {
            color: #a3946a;
            font-size: 16px;
        }
        .error-message {
            background: #faf6ea;
            border: 1px solid #e9dec4;
            padding: 25px;
            border-radius: 6px;
            margin-bottom: 30px;
        }
        .error-message h2 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 12px;
            color: #5f5237;
        }
        .error-message .code {
            font-family: monospace;
            background: #ece2cf;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 8px;
        }
        .home-link {
            display: inline-block;
            background: #dad0b4;
            color: #3b3522;
            text-decoration: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .home-link:hover {
            background: #c9bc98;
        }
        footer {
            margin-top: 30px;
            font-size: 11px;
            color: #b8a87c;
            border-top: 1px solid #ece2cf;
            padding-top: 18px;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-header">
        <h1>404</h1>
        <p>NOT FOUND</p>
    </div>
    <div class="error-message">
        <h2>哎呀，你似乎走进了一片未加载的区块</h2>
        <p>你访问的页面可能已被搬移、删除，或者从未存在过。</p>
        <div class="code">错误代码: 404 - 资源不存在</div>
    </div>
    <a href="/" class="home-link">← 返回论坛首页</a>
    <footer>
        MCWORLD FORUM · 2016
    </footer>
</div>
</body>
</html>
